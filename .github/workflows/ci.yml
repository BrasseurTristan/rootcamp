name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x bin/rootcamp install.sh lib/*.sh labs/*/*.sh tests/*.sh tests/solutions/*.sh

  labs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire la VM de test (Debian 13 + systemd)
        run: docker build -t rootcamp-test -f tests/Dockerfile .
      - name: Démarrer la VM de test
        run: |
          docker run -d --name rootcamp --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw rootcamp-test
          docker exec rootcamp systemctl is-system-running --wait || true
      - name: Tester les labs
        run: docker exec rootcamp bash /opt/rootcamp/tests/run-labs.sh
      - name: Journal système en cas d'échec
        if: failure()
        run: docker exec rootcamp journalctl --no-pager -n 200

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict
